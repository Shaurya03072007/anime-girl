version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aether-postgres
    environment:
      POSTGRES_USER: aether
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aether_secret_pass}
      POSTGRES_DB: aether_companion
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations/001_initial_pgvector_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro

  redis:
    image: redis:7-alpine
    container_name: aether-redis
    ports:
      - "6379:6379"

  adk-backend:
    build:
      context: ./backend
    container_name: aether-adk-backend
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-${GEMINI_API_KEY}}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      DATABASE_URL: postgresql+asyncpg://aether:${POSTGRES_PASSWORD:-aether_secret_pass}@postgres:5432/aether_companion
      REDIS_URL: redis://redis:6379/0
      GEMINI_LIVE_MODEL: ${GEMINI_LIVE_MODEL:-gemini-3.8-live}
      GEMINI_REASONING_MODEL: ${GEMINI_REASONING_MODEL:-gemini-3.8-flash}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      AETHER_API_TOKEN: ${AETHER_API_TOKEN:-aether-dev-local-token-2026}
      HOST: "0.0.0.0"
      PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
