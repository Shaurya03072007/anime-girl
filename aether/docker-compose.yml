version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aether-postgres
    environment:
      POSTGRES_USER: aether
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aether_local_dev}
      POSTGRES_DB: aether_memory_graph
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations/001_initial_pgvector_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro

  redis:
    image: redis:7-alpine
    container_name: aether-redis
    ports:
      - "6379:6379"

  adk-backend:
    build:
      context: ./backend
    container_name: aether-adk-backend
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      DATABASE_URL: postgresql+asyncpg://aether:${POSTGRES_PASSWORD:-aether_local_dev}@postgres:5432/aether_memory_graph
      REDIS_URL: redis://redis:6379/0
      GEMINI_LIVE_MODEL: gemini-3.8-live
      GEMINI_REASONING_MODEL: gemini-3.8-flash
      GEMINI_EMBEDDING_MODEL: gemini-embedding-2-preview
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
